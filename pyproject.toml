[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outguard-med"
version = "1.0.0"
description = "Production-grade Misdirected Email Detection (MED): Point-in-Time Graph + Lexical + Semantic DLP Signal Fusion, Guardrails, A/B Experimentation, and Real-Time Scoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OutGuard ML Engineering"}
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "onnxruntime>=1.17.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
outguard = "outguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
