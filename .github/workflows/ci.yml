name: OutGuard-MED CI & Parity Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-python-and-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install OpenMP & Python package
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          pip install -e ".[dev]"

      - name: Verify artifacts, regression gates & ONNX parity
        run: python3 -m outguard.cli verify

      - name: Run Python unit & FastAPI integration tests
        run: pytest -v

      - name: Run Go cross-language parity & latency benchmarks
        working-directory: services/realtime-scorer-go
        run: go test -v -bench=. -benchmem ./...
